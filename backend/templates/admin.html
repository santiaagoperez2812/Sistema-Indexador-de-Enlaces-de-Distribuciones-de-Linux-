<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin - Linux Distro Index</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="mb-4">Panel de Administración de Distribuciones</h2>
        
        <div class="card shadow-sm mb-5">
            <div class="card-header bg-dark text-white">Agregar Nueva Distribución</div>
            <div class="card-body">
                <form method="POST" action="/admin">
                    <div class="row mb-3">
                        <div class="col">
                            <label>ID (ej. pop_os)</label>
                            <input type="text" name="id" class="form-control" required>
                        </div>
                        <div class="col">
                            <label>Nombre (ej. Pop!_OS)</label>
                            <input type="text" name="name" class="form-control" required>
                        </div>
                        <div class="col">
                            <label>Familia (ej. Debian)</label>
                            <input type="text" name="family" class="form-control" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label>URL del Logo (http...)</label>
                        <input type="url" name="logo" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label>Sitio Web Oficial</label>
                        <input type="url" name="website" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label>Descripción</label>
                        <textarea name="description" class="form-control" rows="2"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Guardar Distribución</button>
                </form>
            </div>
        </div>

        <h4 class="mb-3">Distribuciones en la Base de Datos</h4>
        <table class="table table-striped table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>Logo</th>
                    <th>Nombre</th>
                    <th>Familia</th>
                    <th>ID</th>
                </tr>
            </thead>
            <tbody>
                {% for d in distros %}
                <tr>
                    <td><img src="{{ d.logo }}" alt="logo" width="30"></td>
                    <td>{{ d.name }}</td>
                    <td>{{ d.family }}</td>
                    <td>{{ d.id }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
